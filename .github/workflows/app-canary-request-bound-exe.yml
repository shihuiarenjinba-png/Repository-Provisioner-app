name: APP Canary pinned request-bound Windows EXE

on:
  push:
    branches:
      - codex/e2e-belt-connection-20261027
    paths:
      - .github/workflows/app-canary-request-bound-exe.yml
      - tools/app_canary_request_bound_exe.py
      - tests/test_app_canary_request_bound_exe.py
      - docs/APP_CANARY_PACKAGE_JOB.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-canary-request-bound-exe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pinned-windows-exe:
    if: github.ref == 'refs/heads/codex/e2e-belt-connection-20261027'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact pinned request contract (no Store Identity)
        run: python -m unittest discover -s tests -p "test_app_canary_request_bound_exe.py" -v
      - name: Install Windows EXE builder
        run: python -m pip install --disable-pip-version-check "pyinstaller==6.16.0"
      - name: Clone immutable Factory source and build request-bound EXE
        shell: pwsh
        run: |
          python tools/app_canary_request_bound_exe.py --source-dir "$env:RUNNER_TEMP\factory-source" --output "$env:GITHUB_WORKSPACE\dist\request-bound-offline-notes-canary"
      - name: Publish only unsigned EXE and exact request-bound receipt
        uses: actions/upload-artifact@v4
        with:
          name: app-canary-request-bound-exe-b83702c8948991cc3bd31745db5df64afaf6010f
          path: dist/request-bound-offline-notes-canary/
          if-no-files-found: error
          retention-days: 5
