name: APP commercial Offline Notes source to Provisioner real-byte intake

on:
  pull_request:
    paths:
      - ".github/workflows/app-commercial-notes-intake.yml"

permissions:
  contents: read

concurrency:
  group: app-commercial-notes-intake-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  promoted-notes-source-intake:
    if: startsWith(github.head_ref, 'codex/')
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SOURCE_BRANCH: codex/app-notes-new-save-no-clobber-20261030
      SOURCE_SHA: 2bc5eb249c5d23ee269e75f3b27ee2a7be359791
      REQUEST_ID: app-offline-notes-canary-2bc5eb249c5d
      BUILDER_BRANCH: codex/app-preidentity-strict-job-20261030
      BUILDER_SHA: dd94bd2cd52a84653623f6ccdf727a6cf7903b98
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout Provisioner Draft PR
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout immutable promoted commercial Offline Notes source
        uses: actions/checkout@v4
        with:
          repository: shihuiarenjinba-png/AI-App-Factory
          ref: 2bc5eb249c5d23ee269e75f3b27ee2a7be359791
          path: factory-source
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout independently pinned strict-job builder
        uses: actions/checkout@v4
        with:
          repository: shihuiarenjinba-png/AI-App-Factory
          ref: dd94bd2cd52a84653623f6ccdf727a6cf7903b98
          path: factory-tooling
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Authenticate both exact source and tooling refs
        shell: pwsh
        run: |
          $source = (git -C factory-source rev-parse HEAD).Trim()
          $builder = (git -C factory-tooling rev-parse HEAD).Trim()
          if ($source -ne $env:SOURCE_SHA -or $builder -ne $env:BUILDER_SHA) {
            throw "Pinned source or tooling checkout mismatch"
          }
          $sourceRemote = git -C factory-source ls-remote origin "refs/heads/$env:SOURCE_BRANCH"
          if ($LASTEXITCODE -ne 0 -or -not $sourceRemote) { throw "Offline Notes source branch missing" }
          $sourceHead = ($sourceRemote | Select-Object -First 1).Split("`t")[0]
          if ($sourceHead -ne $env:SOURCE_SHA) { throw "Commercial source branch moved; HOLD" }
          $builderRemote = git -C factory-tooling ls-remote origin "refs/heads/$env:BUILDER_BRANCH"
          if ($LASTEXITCODE -ne 0 -or -not $builderRemote) { throw "Strict builder branch missing" }
          $builderHead = ($builderRemote | Select-Object -First 1).Split("`t")[0]
          if ($builderHead -ne $env:BUILDER_SHA) { throw "Strict builder branch moved; HOLD" }
          git -C factory-source checkout -B $env:SOURCE_BRANCH $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (git -C factory-source status --porcelain -- factory/config.json proposals/offline-notes-canary.json products/offline-notes-canary) {
            throw "Promoted product checkout is dirty"
          }
      - name: Test exact commercial Offline Notes product functions
        run: python -m unittest discover -s factory-source/products/offline-notes-canary/tests -v
      - name: Install pinned unsigned Windows EXE builder
        run: python -m pip install --disable-pip-version-check "pyinstaller==6.16.0"
      - name: Build Offline Notes commercial product without changing immutable source
        shell: pwsh
        run: |
          python factory-tooling/tools/build_windows_exe.py --root factory-source --slug offline-notes-canary --expected-sha "$env:SOURCE_SHA" --source-branch "$env:SOURCE_BRANCH" --request-id "$env:REQUEST_ID" --output proof/commercial
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (git -C factory-source status --porcelain -- factory/config.json proposals/offline-notes-canary.json products/offline-notes-canary) {
            throw "Build changed immutable commercial source"
          }
      - name: Run real-byte Provisioner intake with authenticated HEAD
        shell: pwsh
        run: |
          python -m tools.app_artifact_intake --job proof/commercial-provisioner-job.json --receipt proof/commercial/exe-receipt.json --exe proof/commercial/offline-notes-canary.exe --verify-head --output proof/commercial-intake.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import json, os
          from pathlib import Path
          proof = json.loads(Path("proof/commercial-intake.json").read_text(encoding="utf-8"))
          receipt = json.loads(Path("proof/commercial/exe-receipt.json").read_text(encoding="utf-8"))
          job = json.loads(Path("proof/commercial-provisioner-job.json").read_text(encoding="utf-8"))
          assert proof["status"] == "PRE_IDENTITY_READY"
          assert proof["source_head_verification"] == "VERIFIED_AT_CHECK_TIME"
          assert proof["source_head_sha"] == os.environ["SOURCE_SHA"]
          assert proof["source_sha"] == receipt["source_sha"] == job["source_sha"] == os.environ["SOURCE_SHA"]
          assert proof["request_id"] == receipt["request_id"] == job["request_id"] == os.environ["REQUEST_ID"]
          assert proof["source_branch"] == job["source_branch"] == os.environ["SOURCE_BRANCH"]
          assert proof["slug"] == "offline-notes-canary"
          assert job["display_name"] == receipt["display_name"] == "Offline Notes Canary — Searchable Scratchpad"
          assert job["source_repository"] == "shihuiarenjinba-png/AI-App-Factory"
          assert job["product_type"] == "APP" and job["target_owner"] == "shihuiarenjinba-png"
          assert len(job) == 12
          assert proof["artifact_bytes_verified"] is True
          assert proof["partner_center_registration_type"] == "MSIX_OR_PWA_APP"
          assert proof["partner_center_selection"] == "MSIX or PWA app"
          assert proof["identity_cas_allowed"] is False
          assert proof["identity_attestation"] == "NOT_VERIFIED"
          assert proof["commercial_quality_status"] == "HOLD"
          assert proof["msix_status"] == "NOT_BUILT"
          assert proof["identity_return_target"]["write_authorized"] is False
          assert job["dry_run"] is True and job["requested_actions"] == ["BUILD_WINDOWS"]
          assert set(p.name for p in Path("proof/commercial").iterdir()) == {"offline-notes-canary.exe", "exe-receipt.json"}
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve source-bound receipt, strict job and read-only intake
        uses: actions/upload-artifact@v4
        with:
          name: notes-commercial-source-preidentity-${{ github.event.pull_request.head.sha }}
          path: |
            proof/commercial-intake.json
            proof/commercial/exe-receipt.json
            proof/commercial-provisioner-job.json
          if-no-files-found: error
          retention-days: 5
